name: av2-stream
phase: 3frame-30his

target:
  _target_: src.datamodule.av2_datamodule.Av2DataModule

  data_root: 'data/DeMo_processed'
  train_batch_size: ${batch_size}
  val_batch_size: ${batch_size}
  test_batch_size: ${batch_size}
  shuffle: True
  num_workers: ${num_workers}
  pin_memory: True
  dataset:
    num_historical_steps: 10
    num_future_steps: 40
    sequence_origins: [10, 20, 30]
    radius: 250.0
    train_mode: 'only_focal'
    use_raceline: ${use_raceline}
    use_raceline_velocity: ${use_raceline_velocity}